name: Deploy Lambdas

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: xomappetit
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bundle and deploy lambdas
        run: |
          FUNCTIONS=(
            "meals-create:meals-create"
            "meals-delete:meals-delete"
            "meals-edit:meals-edit"
            "meals-get:meals-get"
            "meals-list:meals-list"
            "meals-rate:meals-rate"
            "meals-ratings:meals-ratings"
            "meals-update:meals-update"
            "meals-comment-add:meals-comment-add"
            "meals-comments-list:meals-comments-list"
            "meals-comment-delete:meals-comment-delete"
          )

          for entry in "${FUNCTIONS[@]}"; do
            fn_dir="${entry%%:*}"
            fn_name="${entry##*:}"
            lambda_name="${APP_NAME}-${fn_name}"

            echo "=== Bundling $fn_name ==="
            rm -rf /tmp/bundle
            mkdir -p /tmp/bundle

            cp -r functions/$fn_dir/* /tmp/bundle/
            cp -r shared/* /tmp/bundle/
            cp package.json /tmp/bundle/

            cd /tmp/bundle
            npm install --omit=dev --ignore-scripts
            zip -r /tmp/${fn_name}.zip . -x '*.git*' >/dev/null
            cd -

            echo "=== Updating $lambda_name ==="
            aws lambda update-function-code \
              --function-name "$lambda_name" \
              --zip-file "fileb:///tmp/${fn_name}.zip" \
              --publish \
              --no-cli-pager >/dev/null

            echo "✓ $fn_name deployed"
          done

      - name: Wait for updates to stabilize
        run: |
          for fn in meals-create meals-delete meals-edit meals-get meals-list meals-rate meals-ratings meals-update meals-comment-add meals-comments-list meals-comment-delete; do
            echo "Waiting for ${APP_NAME}-${fn}..."
            aws lambda wait function-updated --function-name "${APP_NAME}-${fn}" 2>/dev/null || true
          done
          echo "All Lambda functions updated."
