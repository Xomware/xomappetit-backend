name: Deploy Lambdas

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: xomappetit
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bundle and deploy lambdas
        run: |
          # Discover functions from disk so this workflow doesn't drift
          # every time we add or rename a handler.
          FUNCTIONS=()
          for d in functions/*/; do
            name="$(basename "$d")"
            FUNCTIONS+=("$name:$name")
          done

          for entry in "${FUNCTIONS[@]}"; do
            fn_dir="${entry%%:*}"
            fn_name="${entry##*:}"
            lambda_name="${APP_NAME}-${fn_name}"

            echo "=== Bundling $fn_name ==="
            rm -rf /tmp/bundle
            mkdir -p /tmp/bundle

            cp -r functions/$fn_dir/* /tmp/bundle/
            # Preserve shared/ as a real directory (don't flatten) so
            # files inside shared/ keep resolving each other relatively.
            mkdir -p /tmp/bundle/shared
            cp -r shared/* /tmp/bundle/shared/
            cp package.json /tmp/bundle/

            # The handler's requires use the source-tree path
            # ('../../shared/dynamo') but inside the zip the handler sits at
            # the root, so rewrite them to './shared/...'. Source files
            # untouched — this is a bundle-time transform. Both quote styles
            # are covered.
            sed -i "s|'../../shared/|'./shared/|g; s|\"../../shared/|\"./shared/|g" /tmp/bundle/index.js
            # Fail loudly if any '../../shared' references slip through.
            if grep -q "\.\./\.\./shared" /tmp/bundle/index.js; then
              echo "❌ shared-path rewrite missed something in $fn_name"
              grep -n "\.\./\.\./shared" /tmp/bundle/index.js
              exit 1
            fi

            cd /tmp/bundle
            npm install --omit=dev --ignore-scripts
            zip -r /tmp/${fn_name}.zip . -x '*.git*' >/dev/null
            cd -

            # Skip cleanly when the lambda doesn't exist yet — happens right
            # after shipping a new function while the infra terraform apply
            # is still running. The next workflow run picks it up.
            if ! aws lambda get-function --function-name "$lambda_name" --no-cli-pager >/dev/null 2>&1; then
              echo "⚠ $lambda_name does not exist yet (infra not applied?) — skipping"
              continue
            fi

            echo "=== Updating $lambda_name ==="
            aws lambda update-function-code \
              --function-name "$lambda_name" \
              --zip-file "fileb:///tmp/${fn_name}.zip" \
              --publish \
              --no-cli-pager >/dev/null

            echo "✓ $fn_name deployed"
          done

      - name: Wait for updates to stabilize
        run: |
          for d in functions/*/; do
            fn="$(basename "$d")"
            echo "Waiting for ${APP_NAME}-${fn}..."
            aws lambda wait function-updated --function-name "${APP_NAME}-${fn}" 2>/dev/null || true
          done
          echo "All Lambda functions updated."
